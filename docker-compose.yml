services:
  version: '3.8'

  services:
    rag-api:
      build: .
      container_name: enterprise_rag_api
      ports:
        - "8000:8000"
      volumes:
        - ./data:/app/data
      extra_hosts:
        - "host.docker.internal:host-gateway"
      environment:
        - PYTHONUNBUFFERED=1
      restart: unless-stopped