name: CI Pipeline

# Trigger fuer Push und Pull Requests / Триггеры запуска при push и PR
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Quellcode auschecken / Клонирование репозитория
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Python-Umgebung einrichten / Настройка окружения Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Abhaengigkeiten installieren / Установка зависимостей
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Automatisierte Tests ausfuehren / Запуск тестов через pytest
      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: |
          pytest -v